# --- Network Essentials ---
CONFIG_NETWORKING=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y

# IPv4 Only (Saves ~10kB vs Dual Stack)
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y

# --- Memory Management (The Squeeze) ---
# We reduced static usage (MbedTLS, IPv6, Logs), so we can GROW the Heap.
# Try 90KB. If this fails to link, reduce to 80000.
CONFIG_HEAP_MEM_POOL_SIZE=80000

# Minimal Main Stack
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=2048

# --- Network Buffers (Minimum viable for TCP) ---
# Too small = dropped packets. Too large = OOM.
# 8 is a safe lower bound for simple OPC UA.
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_MAX_CONTEXTS=5
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=2048

# --- Open62541 & System ---
CONFIG_OPEN62541=y
CONFIG_POSIX_API=y
CONFIG_EVENTFD=y
CONFIG_ZVFS_OPEN_MAX=10
CONFIG_NET_SOCKETS_POLL_MAX=10

# C++ & LibC
CONFIG_CPP=n
CONFIG_STD_CPP11=n
CONFIG_REQUIRES_FULL_LIBC=n
CONFIG_NEWLIB_LIBC=n

# --- Disable Heavy Features ---
# Logging eats RAM for buffers. Disable it for production/testing.
CONFIG_LOG=y
CONFIG_NET_LOG=y

# Disable MbedTLS (We disabled encryption in CMake)
CONFIG_MBEDTLS=y